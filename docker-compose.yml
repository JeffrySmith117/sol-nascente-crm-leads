services:
  db:
    image: postgres:16-alpine
    container_name: crmleads_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crmleads_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - crmleads_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: crmleads_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: crmleads_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: troque-esta-chave-por-uma-bem-maior-e-secreta-em-producao-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:5174
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8081/api
    container_name: crmleads_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  crmleads_db_data: